name: Free verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rule-mock:
    runs-on: ubuntu-latest
    env:
      BUTTERFLYLAB_REAL_LLM_ENABLED: '0'
      BUTTERFLYLAB_LLM_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m backend.check_environment
      - run: python -m pytest backend -q
      - run: python -m backend.verify_pilot
      - run: python scripts/build_public_demo.py
      - run: python scripts/verify_public_demo.py
      - run: npm run test:explore
        working-directory: frontend
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python scripts/startup_smoke.py
      - run: python -m backend.release_scan
      - run: python -m backend.repository_hygiene
