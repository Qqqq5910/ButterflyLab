name: Bug Report
description: Report a reproducible problem without credentials or private data.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node versions, release or commit.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected versus actual behavior
      description: Prefer a minimal Rule/Mock example. Sanitize any logs.
    validations:
      required: true
